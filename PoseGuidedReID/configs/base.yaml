_base_: data/storage_local.yaml

MODEL:
  AGG_POSE_FEATURE: false

INPUT:
  AUG_PROFILE: strong
  RESOLUTION: 224

DATALOADER:
  NUM_INSTANCE: 8
  NUM_WORKERS: 4

SOLVER:
  IMS_PER_BATCH: 64
  MAX_EPOCHS: 30
  OPTIMIZER_NAME: AdamW
  BASE_LR: 1.0e-4
  WEIGHT_DECAY: 0.05
  SCHEDULER: cosine_warmup
  WARMUP_EPOCHS: 5
  MIN_LR: 0.0
  MARGIN: 0.3

EVAL:
  CHECKPOINT_METRIC: val_rank1
  VAL_EVERY_N_EPOCHS: 2
